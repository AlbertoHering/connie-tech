<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Connietech Hero Pattern</title>
  <desc id="desc">Subtle gradient mesh background with network-like lines.</desc>
  <defs>
    <linearGradient id="mesh" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.5" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#0052CC"/>
      <stop offset="0.6" stop-color="#10B981"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <g opacity="0.15" stroke="url(#brand)">
    <path d="M0 200 C 200 120, 400 280, 600 200 S 1000 120, 1200 200 S 1600 280, 1600 280" fill="none" stroke-width="3"/>
    <path d="M0 450 C 250 370, 500 530, 750 450 S 1250 370, 1500 450 S 1600 530, 1600 530" fill="none" stroke-width="3"/>
    <path d="M0 700 C 200 620, 400 780, 600 700 S 1000 620, 1200 700 S 1600 780, 1600 780" fill="none" stroke-width="3"/>
  </g>
</svg>
