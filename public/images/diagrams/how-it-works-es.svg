<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="220" viewBox="0 0 1280 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cómo funcionamos — Connietech (Español)</title>
  <desc id="desc">Línea de tiempo horizontal de seis pasos: Nos cuentas, Diseñamos, Abastecemos, Negociamos, Compras, Ejecutas.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0052CC"/>
      <stop offset="0.6" stop-color="#10B981"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <style><![CDATA[
      .label{font:600 14px Inter,Arial,Helvetica,sans-serif; fill:#1F2937}
      .sub{font:400 12px Inter,Arial,Helvetica,sans-serif; fill:#6B7280}
    ]]></style>
  </defs>
  <rect x="60" y="110" width="1160" height="4" rx="2" fill="url(#g)" opacity="0.45"/>
  <g transform="translate(80,60)">
    <circle cx="0" cy="50" r="16" fill="#0052CC"/>
    <text class="label" x="-30" y="0">Nos cuentas</text>
    <text class="sub" x="-66" y="18">Alcance • Presupuesto • Plazo</text>
  </g>
  <g transform="translate(304,60)">
    <circle cx="0" cy="50" r="16" fill="#0EA5E9"/>
    <text class="label" x="-26" y="0">Diseñamos</text>
    <text class="sub" x="-64" y="18">BOM correcto • Opciones</text>
  </g>
  <g transform="translate(528,60)">
    <circle cx="0" cy="50" r="16" fill="#10B981"/>
    <text class="label" x="-58" y="0">Abastecemos global</text>
    <text class="sub" x="-78" y="18">EE. UU. • LATAM • China</text>
  </g>
  <g transform="translate(752,60)">
    <circle cx="0" cy="50" r="16" fill="#F59E0B"/>
    <text class="label" x="-32" y="0">Negociamos</text>
    <text class="sub" x="-88" y="18">Precio • Términos • Entrega</text>
  </g>
  <g transform="translate(976,60)">
    <circle cx="0" cy="50" r="16" fill="#6366F1"/>
    <text class="label" x="-26" y="0">Compras</text>
    <text class="sub" x="-98" y="18">Con nosotros o recomendado</text>
  </g>
  <g transform="translate(1200,60)">
    <circle cx="0" cy="50" r="16" fill="#FF6B35"/>
    <text class="label" x="-20" y="0">Ejecutas</text>
    <text class="sub" x="-80" y="18">Instalas • Soporte</text>
  </g>
</svg>
