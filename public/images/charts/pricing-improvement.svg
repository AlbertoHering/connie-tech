<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pricing Improvement — Connietech</title>
  <desc id="desc">Bar chart comparing Typical vs Connietech pricing, highlighting 15–25% better pricing.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0052CC"/>
      <stop offset="0.6" stop-color="#10B981"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <style><![CDATA[
      .axis{stroke:#E5E7EB; stroke-width:1}
      .label{font:600 14px Inter,Arial,Helvetica,sans-serif; fill:#374151}
      .note{font:500 12px Inter,Arial,Helvetica,sans-serif; fill:#6B7280}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="640" height="260" rx="12" fill="#FFFFFF"/>
  <line x1="60" y1="210" x2="600" y2="210" class="axis"/>
  <line x1="60" y1="110" x2="600" y2="110" class="axis" opacity="0.6"/>
  <line x1="60" y1="60" x2="600" y2="60" class="axis" opacity="0.4"/>

  <!-- Typical (100%) -->
  <rect x="120" y="60" width="120" height="150" rx="8" fill="#CBD5E1"/>
  <text class="label" x="180" y="230" text-anchor="middle">Typical</text>
  <text class="note" x="180" y="50" text-anchor="middle">100%</text>

  <!-- Connietech (85% as example) -->
  <rect x="380" y="82.5" width="120" height="127.5" rx="8" fill="url(#g)"/>
  <text class="label" x="440" y="230" text-anchor="middle">Connietech</text>
  <text class="note" x="440" y="72" text-anchor="middle">~85%</text>

  <g transform="translate(320,20)">
    <rect x="0" y="0" width="300" height="28" rx="6" fill="#ECFDF5" stroke="#10B981"/>
    <text class="label" x="10" y="19" fill="#047857">15–25% better pricing</text>
  </g>
</svg>
